      <li><strong>Scalability planning</strong> — Use autoscaling and capacity tests to prepare for demand.</li>
      <li><strong>Cost monitoring</strong> — Track and allocate cloud spend to reduce waste.</li>
      <li><strong>Cluster orchestration (Kubernetes)</strong> — Manage containerized workloads reliably.</li>
      <li><strong>Disaster recovery</strong> — Define RTO/RPO and rehearse recovery procedures.</li>
