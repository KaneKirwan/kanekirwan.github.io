# Add remaining pages + CSS using the repository's GITHUB_TOKEN.
# Usage: add this file to your repo, then go to Actions -> "Add remaining pages" -> Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Create directories
        run: |
          mkdir -p pages assets/css

      - name: Add stylesheet
        run: |
          cat > assets/css/styles.css <<'CSS'
:root{
  --bg:#ffffff;
  --muted:#6b7280;
  --accent:#0d6efd;
  --max-width:1100px;
  --radius:10px;
  --container-pad:24px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial;line-height:1.5;color:#111827;background:var(--bg)}
.container{max-width:var(--max-width);margin:0 auto;padding:var(--container-pad)}
.site-header{border-bottom:1px solid #eef2f7;background:#fff}
.site-header .container{display:flex;align-items:center;justify-content:space-between;padding:16px 24px}
.brand{font-weight:700;color:#111827;text-decoration:none;font-size:1.125rem}
.main-nav a{margin-left:16px;color:var(--muted);text-decoration:none}
.hero{padding:48px 0}
.hero h1{font-size:2rem;margin:0}
.lead{color:var(--muted);margin-top:8px}
.cta{display:inline-block;margin-top:12px;padding:10px 16px;background:var(--accent);color:white;border-radius:8px;text-decoration:none}
.overview{padding:24px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.card{background:#fff;padding:16px;border-radius:var(--radius);box-shadow:0 1px 3px rgba(15,23,42,0.04)}
.feature-list{list-style:none;padding:0;margin:0}
.feature-list li{padding:8px 0}
.feature-list a{text-decoration:none;color:var(--accent)}
.site-footer{border-top:1px solid #eef2f7;padding:20px 0;margin-top:48px;color:var(--muted)}
@media (max-width:700px){.main-nav{display:none}}
CSS

      - name: Add pages/design.html
        run: |
          cat > pages/design.html <<'HTML'
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Design — 10 tools & ways to use them</title>
  <link rel="stylesheet" href="/assets/css/styles.css">

  <!-- Google AdSense Auto ads script (place on every page) -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6401689986828218"
     crossorigin="anonymous"></script>
</head>
<body>
  <header class="site-header"><div class="container"><a class="brand" href="/">Kane Kirwan</a><nav class="main-nav"><a href="/">Home</a><a href="/pages/development.html">Development</a><a href="/pages/design.html">Design</a></nav></div></header>
  <main class="container">
    <h1>Design — 10 tools & ways to use them</h1>
    <p class="lead">Practical ways to use common design tools effectively.</p>
    <ol>
      <li><strong>Figma</strong> — Rapid prototyping and design systems; use components & variants to maintain consistency.</li>
      <li><strong>Sketch</strong> — Pixel-accurate UI design; use symbols and shared libraries for team consistency.</li>
      <li><strong>Adobe XD</strong> — Interactive prototypes and voice-enabled interactions; leverage plugins to export assets.</li>
      <li><strong>Figma Plugins</strong> — Automate repetitive tasks (tokens, content, icon swaps) to speed up handoff.</li>
      <li><strong>Storybook</strong> — Build and display UI components in isolation for designers and engineers to collaborate.</li>
      <li><strong>Zeplin</strong> — Provide specs, assets, and measurements for developers from designs.</li>
      <li><strong>Principle / Framer</strong> — High-fidelity interactions and micro-interactions for usability testing.</li>
      <li><strong>Notion</strong> — Design documentation and pattern libraries with examples and usage guidance.</li>
      <li><strong>Google Fonts / Variable Fonts</strong> — Use variable fonts to reduce HTTP requests and scale typography responsively.</li>
      <li><strong>Accessibility tools</strong> (axe, Lighthouse) — Integrate checks into design review to catch color contrast and semantics early.</li>
    </ol>
  </main>
  <footer class="site-footer"><div class="container">© 2025 Kane Kirwan</div></footer>
</body>
</html>
